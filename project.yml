name: Economix
options:
  bundleIdPrefix: com.furkanfuat
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: tr
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES

packages:
  EconomixCore:
    path: Packages/EconomixCore

targets:
  Economix:
    type: application
    platform: iOS
    configFiles:
      Debug: Config/Secrets.xcconfig
      Release: Config/Secrets.xcconfig
    sources:
      - Economix
    dependencies:
      - package: EconomixCore
    entitlements:
      path: Economix/Economix.entitlements
      properties:
        aps-environment: development
        # Eski yazım bilinçli: mevcut iCloud verileri bu kapsayıcıda (ModelContainerFactory.cloudContainerID).
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.furkanfuat.ecoomix
        com.apple.developer.icloud-services:
          - CloudKit
    info:
      path: Economix/Info.plist
      properties:
        CFBundleDisplayName: Economix
        CFBundleDevelopmentRegion: tr
        UILaunchScreen: {}
        UIBackgroundModes:
          - remote-notification
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSFaceIDUsageDescription: "Economix'i kilitlemek için Face ID kullanılır."
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.furkanfuat.economix
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES

  EconomixTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - EconomixTests
    dependencies:
      - target: Economix
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.furkanfuat.economix.tests
        GENERATE_INFOPLIST_FILE: YES

  EconomixUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - EconomixUITests
    dependencies:
      - target: Economix
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.furkanfuat.economix.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Economix
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated

schemes:
  Economix:
    build:
      targets:
        Economix: all
        EconomixTests: [test]
    test:
      targets:
        - EconomixTests
    run:
      config: Debug
  EconomixScreens:
    build:
      targets:
        Economix: all
        EconomixUITests: [test]
    test:
      targets:
        - EconomixUITests
